<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <base target="_top">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    :root{--accent:#785032;--button-text:#fff;--paper:#faf6ed;--ink:#2d241e;--line:#ddd4c9;--surface:#fffdf9;--muted:#605852;--backdrop:none;color-scheme:light}
    *{box-sizing:border-box} [hidden]{display:none!important}
    body{margin:0;background:linear-gradient(120deg,color-mix(in srgb,var(--paper) 93%,transparent),color-mix(in srgb,var(--paper) 83%,transparent)),var(--backdrop) center/cover fixed,var(--paper);color:var(--ink);font:16px/1.5 system-ui,sans-serif;min-height:100vh}
    h1,h2,h3,p{margin:0} h1,h2,h3{line-height:1.05;font-family:Georgia,serif;font-weight:500;letter-spacing:-.025em}
    h1{font-size:clamp(2.5rem,5vw,4.1rem)} h2{font-size:2rem} h3{font-size:1.56rem;overflow-wrap:anywhere}
    button,input,select,textarea{font:inherit} button{cursor:pointer} button:disabled{opacity:.55;cursor:default}
    :focus-visible{outline:2px solid #765331;outline-offset:3px} .wrap{width:min(1250px,calc(100% - 52px));margin-inline:auto}
    header{position:sticky;top:0;z-index:100;background:var(--surface);color:#2d241e;border-bottom:1px solid var(--line)} .bar{min-height:72px;display:flex;align-items:center;justify-content:space-between;gap:14px;padding-block:10px}
    .brand{display:flex;align-items:center;gap:10px;min-width:0}.brand strong{font:600 1.55rem/1.05 Georgia,serif;overflow-wrap:anywhere}
    #logo,.mark{width:39px;height:39px;border-radius:10px;flex-shrink:0}.mark{display:grid;place-items:center;background:var(--accent);color:var(--button-text);font:600 1.25rem Georgia,serif} #logo{object-fit:contain}
    .actions,.tabs,.row{display:flex;align-items:center;gap:9px;flex-wrap:wrap}.row{justify-content:space-between}
    main{padding-block:34px 58px}.intro{display:grid;gap:8px;margin-bottom:24px}
    .muted{color:var(--muted)}.intro .muted{color:inherit}.small{font-size:.875rem}.btn{min-height:42px;display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:8px 14px;border-radius:8px;background:var(--accent);border:1px solid transparent;color:var(--button-text);font-size:.9rem;font-weight:650;line-height:1.25}
    .btn:not(:disabled):hover{filter:brightness(.92)}.secondary{background:var(--surface);color:#32271f;border-color:var(--line)}.icon{padding:6px 10px}
    .metrics{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-bottom:23px}
    .metric{background:var(--surface);color:#2d241e;border:1px solid var(--line);border-radius:12px;padding:13px 16px;display:grid;gap:5px}.metric strong{font:500 2rem Georgia,serif}
    .tabs{border-bottom:1px solid color-mix(in srgb,var(--ink) 23%,transparent);padding-bottom:12px;margin-bottom:16px}.tabs .btn[aria-pressed=true]{background:var(--accent);color:var(--button-text)}
    .section-head{margin-block:0 15px}.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
    .tile{border:1px solid var(--line);background:var(--surface);color:#2d241e;border-radius:15px;overflow:hidden;display:flex;flex-direction:column;box-shadow:0 7px 22px #24180c0b}
    .tile-cover{width:100%;height:151px;object-fit:cover;display:block;background:#e5dbcc}.tile-cover[hidden]{display:none}.tile-body{padding:17px;display:grid;gap:8px;align-content:start;flex:1}.tile-actions{padding:0 17px 17px}
    .tile-costs{margin:2px 0;display:grid;gap:5px;font-size:.875rem}.tile-costs div{display:flex;justify-content:space-between;flex-wrap:wrap;gap:0 8px}.tile-costs dd{margin:0;font-weight:700;font-variant-numeric:tabular-nums}
    .finance-metrics .metric strong{font-size:clamp(1.125rem,3vw,1.65rem);overflow-wrap:anywhere}
    .order-summary{margin:0 0 18px;padding:12px 16px;display:grid;grid-template-columns:repeat(auto-fit,minmax(125px,1fr));gap:10px}
    .order-summary div{display:flex;align-items:center;justify-content:space-between;gap:8px}.order-summary dd{margin:0;font-weight:750;font-variant-numeric:tabular-nums}
    .part-usage{max-width:340px;white-space:normal}.part-usage .badge{overflow-wrap:anywhere}
    .off{background:#eeece8;border-color:#cbc6bd}.off .tile-cover{filter:grayscale(1)}.badge{display:inline-flex;width:fit-content;border-radius:40px;padding:3px 9px;background:#e6efe3;color:#305537;font-weight:650;font-size:.83rem}.badge.off{background:#ddd9d2;color:#4c4842}
    .shortages{margin:0;padding-left:20px;font-size:.875rem}.surface{background:var(--surface);color:#2d241e;border:1px solid var(--line);border-radius:12px}.empty{padding:22px}.scroll{overflow:auto}table{border-collapse:collapse;width:100%;text-align:left;white-space:nowrap}
    th,td{border-bottom:1px solid var(--line);padding:10px 15px}th{background:#f2eadf;font-size:.875rem}tbody tr:last-child td{border:0}
    dialog{width:min(610px,calc(100% - 24px));max-height:calc(100dvh - 24px);margin:auto;padding:22px;border:1px solid var(--line);border-radius:16px;background:var(--surface);color:#2d241e;box-shadow:0 22px 85px #30241b36}
    dialog::backdrop{background:#2c211bb0}.dialog-head{margin-bottom:16px;align-items:start}.stack{display:grid;gap:13px}.pair{display:grid;grid-template-columns:1fr 1fr;gap:10px}
    body:has(dialog[open]){overflow:hidden}
    dialog{overflow:auto;overscroll-behavior:contain}
    .assembly-image{display:block;width:100%;height:min(45dvh,320px);object-fit:contain;border-radius:10px;background:#f2eadf}
    .assembly-parts{white-space:normal}.assembly-parts th:last-child,.assembly-parts td:last-child{text-align:right}
    .assembly-parts td:first-child{overflow-wrap:anywhere}
    .tile .shortages,.assembly-parts .insufficient{color:#962c28}
    .assembly-parts .insufficient{background:#fceae6}
    .costing-note{border-top:1px solid var(--line);padding-top:10px}
    label{display:grid;gap:5px;font-size:.9rem;font-weight:650} input,select,textarea{background:#fff;border:1px solid #a69a8b;border-radius:7px;min-height:42px;padding:7px 10px;color:#29211b;min-width:0;width:100%}textarea{resize:vertical}input[type=color]{padding:3px} .check{display:flex;gap:7px;align-items:center}.check input{width:17px;min-height:0}
    .recipe{display:grid;grid-template-columns:minmax(0,1fr) 82px 37px;gap:8px;align-items:end}.cart-line{display:grid;grid-template-columns:minmax(0,1fr) 72px 38px;gap:8px;align-items:center;border-bottom:1px solid var(--line);padding-bottom:10px} .cart-line strong{overflow-wrap:anywhere}
    .purchase-fields{background:#f7f1e8;border:1px solid var(--line);border-radius:9px;padding:12px}
    .locked-field,.locked-field input{pointer-events:none}.locked-field input{background:#efebe5;color:#625a52}
    .margin-summary{background:#f7f1e8;border:1px solid var(--line);border-radius:9px;padding:12px}
    .negative{color:#772f23}.danger{background:#8a3b30;color:#fff}.status-delivery{background:#e2eaf4;color:#334b69}
    .status-assembling{background:#f4e8d0;color:#705023}
    .history-entry{border-bottom:1px solid var(--line);padding-bottom:11px}.history-entry:last-child{border-bottom:0}
    .alert{color:#772f23;background:#f8e5de;border-radius:8px;padding:9px 12px;font-size:.9rem}.toast{position:fixed;right:16px;bottom:16px;max-width:calc(100% - 32px);background:#30231a;color:#fff;border-radius:8px;padding:10px 16px;box-shadow:0 8px 24px #0003}
    .signin{max-width:440px;padding:23px}.signin h1{font-size:2.3rem}.skip:not(:focus){position:absolute;clip-path:inset(50%)} .skip:focus{position:absolute;background:#fff;padding:8px}
    .system-link{position:fixed;right:clamp(16px,4vw,40px);bottom:18px;color:#605852;font-size:.875rem;text-decoration:underline;text-underline-offset:3px}
    .system-grid{display:grid;grid-template-columns:minmax(0,2fr) minmax(235px,1fr);gap:16px;align-items:start}
    .system-grid table{white-space:normal;overflow-wrap:anywhere}.system-grid form{padding:18px}
    .system-grid h2{margin-bottom:8px}.system-key{font:0.875rem/1.5 monospace;overflow-wrap:anywhere}
    @media(max-width:850px){.tiles{grid-template-columns:repeat(2,minmax(0,1fr))}.system-grid{grid-template-columns:1fr}}
    @media(max-width:550px){.wrap{width:calc(100% - 28px)}main{padding-top:24px}.tiles{grid-template-columns:1fr}.metric{padding:10px}.metric span{font-size:.78rem}.brand strong{font-size:1.2rem}.actions{gap:5px}.bar .btn{padding-inline:8px}.pair{gap:7px}}
  </style>
</head>
<body>
  <a class="skip" href="#main" target="_self">Skip to inventory</a>
  <header><div class="wrap bar"><div class="brand"><span id="mark" class="mark" aria-hidden="true">I</span><img id="logo" alt="" hidden><strong id="brand">Inventory</strong></div><div id="header-actions" class="actions"></div></div></header>
  <main id="main" class="wrap" tabindex="-1"><p role="status">Loading inventory…</p></main>
  <dialog id="dialog" aria-labelledby="dialog-title"></dialog>
  <div id="toast" class="toast" role="status" hidden></div>
  <script>
    const $ = selector => document.querySelector(selector);
    const main = $('#main');
    const dialog = $('#dialog');
    const money = amount => new Intl.NumberFormat('en-PH',{style:'currency',currency:'PHP'}).format(amount/100);
    const unitMoney = amount => amount == null ? '—' : new Intl.NumberFormat('en-PH',{
      style:'currency',currency:'PHP',minimumFractionDigits:2,maximumFractionDigits:4,
    }).format(amount/100);
    const displayDate = new Intl.DateTimeFormat('en-PH',{dateStyle:'medium',timeStyle:'short',timeZone:'Asia/Manila'});
    const safe = value => String(value ?? '').replace(/[&<>"']/g, char => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[char]);
    const hex = /^#[0-9a-f]{6}$/i;
    const imageURL = /^data:image\/(jpeg|png|webp);base64,[A-Za-z0-9+/]+=*$/;
    const defaults = {storeName:'Inventory',accent:'#785032',background:'#faf6ed',ink:'#2d241e'};
    const orderStatuses = ['Order Placed','Assembling','Delivery','Fulfilled'];
    const consumableCostNote = '<p class="muted small costing-note">Note: Consumable items are excluded from the material cost calculation. Adjust your selling price accordingly to cover overhead supplies.</p>';
    const state = {data:null,system:null,token:null,tab:'packages',orders:null,cart:new Map(),orderKey:null,assets:new Map(),opener:null};
    const button = (label,action,id='',kind='secondary',disabled=false) =>
      '<button type="button" class="btn '+kind+'" data-action="'+action+'" data-id="'+safe(id)+'"'+(disabled?' disabled':'')+'>'+label+'</button>';

    function rpc(name, data, token = state.token) {
      return new Promise((resolve,reject) => {
        google.script.run.withFailureHandler(() => reject(new Error('Could not reach Apps Script. Try again.')))
          .withSuccessHandler(result => {
            if (result.ok) resolve(result.data);
            else reject(Object.assign(new Error(result.error),{code:result.code}));
          }).action(name,token,data ?? null);
      });
    }

    function session(token) {
      state.token = token;
      try {
        if (token) sessionStorage.setItem('inventory-session',token);
        else sessionStorage.removeItem('inventory-session');
      } catch {}
    }

    function notice(text) {
      const node = $('#toast');
      node.textContent = text;
      node.hidden = false;
      clearTimeout(notice.timer);
      notice.timer = setTimeout(() => { node.hidden = true; },4300);
    }

    function show(title, contents) {
      if (!dialog.open) state.opener = document.activeElement;
      dialog.innerHTML = '<div class="row dialog-head"><h2 id="dialog-title">'+safe(title)+'</h2>'+
        '<button type="button" class="btn secondary icon" data-action="close" aria-label="Close">×</button></div>'+
        '<p id="dialog-error" class="alert" role="alert" hidden></p>'+contents;
      if (!dialog.open) dialog.showModal();
      else dialog.querySelector('input,button')?.focus();
    }
    dialog.addEventListener('close',()=>{
      if (!dialog.open && dialog.querySelector('[data-system-key]')) dialog.replaceChildren();
      (state.opener?.isConnected ? state.opener : main).focus({preventScroll:true});
    });

    function fail(error) {
      if (error.code === 'AUTH' && (state.token || state.system)) {
        if (dialog.open) dialog.close();
        signInView(error.message);
        return;
      }
      const target = dialog.open ? $('#dialog-error') : $('#login-error') || $('#system-error');
      if (target) { target.textContent = error.message; target.hidden = false; }
      else notice(error.message);
    }

    function asset(kind,id='') {
      const key = kind+':'+id;
      if (!state.assets.has(key)) {
        const fetch = rpc('asset',{kind,id}).then(url => imageURL.test(url) ? url : '');
        state.assets.set(key,fetch);
        fetch.catch(() => { if (state.assets.get(key) === fetch) state.assets.delete(key); });
      }
      return state.assets.get(key);
    }

    function readableText(color) {
      const values = color.slice(1).match(/../g).map(x => parseInt(x,16)/255)
        .map(x => x<=.04045 ? x/12.92 : ((x+.055)/1.055)**2.4);
      return .2126*values[0]+.7152*values[1]+.0722*values[2]>.179 ? '#141414' : '#ffffff';
    }

    function applyBrand(settings=defaults) {
      const root = document.documentElement.style;
      for (const [key,variable] of [['accent','--accent'],['background','--paper'],['ink','--ink']]) {
        root.setProperty(variable,hex.test(settings[key]) ? settings[key] : defaults[key]);
      }
      root.setProperty('--button-text',readableText(hex.test(settings.accent) ? settings.accent : defaults.accent));
      $('#brand').textContent = settings.storeName;
      $('#mark').textContent = [...settings.storeName][0]?.toUpperCase() || 'I';
      $('#logo').hidden = true;
      $('#mark').hidden = false;
      root.setProperty('--backdrop','none');
      if (settings.hasLogo) asset('logo').then(url => {
        if (url && state.data?.brand === settings) { $('#logo').src=url; $('#logo').hidden=false; $('#mark').hidden=true; }
      }).catch(()=>{});
      if (settings.hasBackdrop) asset('backdrop').then(url => {
        if (url && state.data?.brand === settings) root.setProperty('--backdrop','url("'+url+'")');
      }).catch(()=>{});
    }

    function signInView(message='') {
      session(null);
      state.data = null;
      state.system = null;
      state.orders = null;
      state.cart.clear();
      state.orderKey = null;
      state.assets.clear();
      applyBrand();
      $('#header-actions').innerHTML='';
      main.innerHTML='<section class="surface signin stack"><h1>Owner sign-in</h1>'+
        '<p class="muted">Enter the access key for your brand workspace.</p><p id="login-error" class="alert" role="alert" hidden></p>'+
        '<form class="stack" data-form="signIn"><label>Owner access key<input name="key" type="password" required autocomplete="off"></label>'+
        '<button class="btn">Sign in</button></form></section>'+
        '<a class="system-link" href="#system-owner" target="_self" data-action="systemSignIn">Login as system owner</a>';
      if (message) fail(new Error(message));
    }

    function renderSystem() {
      const {email,users} = state.system;
      $('#header-actions').innerHTML = button('Back to owner sign-in','systemExit');
      main.innerHTML = '<section><div class="intro"><h1>Super Admin</h1><p>'+safe(email)+'</p></div>'+
        '<p id="system-error" class="alert" role="alert" hidden></p><div class="system-grid">'+
        '<section aria-labelledby="system-users"><h2 id="system-users">Users</h2>'+
        (users.length ? '<div class="surface scroll"><table><thead><tr><th scope="col">Store Name</th>'+
          '<th scope="col">Email Address</th><th scope="col">Access key</th></tr></thead><tbody>'+
          users.map(user=>{
            const status = {legacy:'Legacy key',none:'No key issued',ready:'••••••••'}[user.keyStatus];
            return '<tr><td>'+safe(user.storeName)+'</td><td>'+safe(user.email)+'</td><td><div class="actions">'+status+
              (user.keyStatus==='ready'?button('Show key','systemRevealKey',user.id):'')+
              button(user.keyStatus==='none'?'Issue key':'Replace key','systemReplaceKey',user.id)+'</div></td></tr>';
          }).join('')+'</tbody></table></div>' : '<p class="surface empty">No owner workspaces yet.</p>')+'</section>'+
        '<form class="surface stack" data-form="systemProvision"><h2>Provision user</h2>'+
        '<label>Email Address<input name="email" type="email" maxlength="254" required></label>'+
        '<label>Store Name<input name="storeName" maxlength="80" required></label>'+
        '<button class="btn">Create workspace</button></form></div></section>';
    }

    function showSystemKey(id, key) {
      const user = state.system?.users.find(item=>item.id===id);
      if (!user) return;
      show('Owner access key','<div class="stack"><p>'+safe(user.storeName)+'</p>'+
        '<textarea class="system-key" data-system-key aria-label="Owner access key" rows="3" readonly>'+safe(key)+'</textarea>'+
        '<div>'+button('Copy key','copySystemKey')+'</div></div>');
    }

    function confirmSystemKey(id) {
      const user = state.system?.users.find(item=>item.id===id);
      if (!user) return;
      const replace = user.keyStatus!=='none';
      show(replace?'Replace access key':'Issue access key','<form class="stack" data-form="systemReplaceKey" data-id="'+
        safe(id)+'"><p>'+safe(user.storeName)+'</p>'+
        (replace?'<p>The old key and active sessions for this workspace will stop working.</p>':'')+
        '<div class="actions">'+button('Cancel','close')+'<button class="btn">'+(replace?'Replace key':'Issue key')+'</button></div></form>');
    }

    function accept(result) {
      state.data = result;
      applyBrand(result.brand);
      render();
    }

    function renderHeader() {
      const count = [...state.cart.values()].reduce((sum,line)=>sum+line.quantity,0);
      $('#header-actions').innerHTML = button('Cart ('+count+')','cart','','')+button('Sign out','signOut');
    }

    function render() {
      renderHeader();
      const {packages,parts} = state.data;
      const ready = packages.filter(kit=>kit.available>0).length;
      const metrics = [['Available packages',ready],['Unavailable packages',packages.length-ready],
        ['Low-stock parts',parts.filter(part=>part.stock<=part.threshold).length]];
      main.innerHTML='<section><div class="intro"><h1>Inventory dashboard</h1><p class="muted">Manage package recipes, stock, and owner-logged orders.</p></div>'+
        '<div class="metrics">'+metrics.map(([name,count])=>'<div class="metric"><span>'+name+'</span><strong>'+count+'</strong></div>').join('')+
        '</div><dl class="surface order-summary" id="order-summary" aria-label="Order status overview" aria-live="polite">'+orderSummary(state.data.orderStatusCounts)+
        '</dl><nav class="tabs" aria-label="Workspace">'+[['packages','Packages'],['parts','Inventory parts'],['orders','Orders'],['finance','Financial Report'],['brand','Branding']].map(([id,label])=>
          '<button type="button" class="btn secondary" data-action="tab" data-id="'+id+'" aria-pressed="'+(state.tab===id)+'">'+label+'</button>').join('')+
        '</nav><div id="panel"></div></section>';
      if (state.tab==='parts') return renderParts(parts);
      if (state.tab==='orders') return renderOrders();
      if (state.tab==='finance') return renderFinance();
      if (state.tab==='brand') return renderBrand(state.data.brand);
      renderPackages(packages);
    }

    function orderSummary(counts) {
      return orderStatuses.map(status=>'<div><dt class="small">'+status+'</dt><dd>'+(counts?.[status] ?? 0)+'</dd></div>').join('');
    }

    async function refreshOrderSummary() {
      const data = state.data;
      if (!data || !state.token || document.hidden) return;
      const counts = await rpc('orderStatusCounts').catch(()=>null);
      if (!counts || state.data!==data) return;
      const summary = $('#order-summary');
      if (!summary) return;
      data.orderStatusCounts = counts;
      const markup = orderSummary(counts);
      if (summary.innerHTML!==markup) summary.innerHTML=markup;
    }

    function renderPackages(packages) {
      const parts = new Map(state.data.parts.map(part=>[part.id,part]));
      $('#panel').innerHTML='<div class="row section-head"><h2>Product packages</h2>'+button('New package','editPackage','','')+'</div>'+
        (packages.length ? '<div class="tiles">'+packages.map(kit=>
          '<article class="tile" data-kit="'+kit.id+'" aria-labelledby="title-'+kit.id+'">'+
            (kit.hasPhoto?'<img class="tile-cover" data-photo="'+kit.id+'" alt="" hidden>':'')+
            '<div class="tile-body"><span class="badge" data-stock-status></span><h3 id="title-'+kit.id+'">'+safe(kit.name)+'</h3>'+
            (kit.description?'<p class="muted small">'+safe(kit.description)+'</p>':'')+
            packageTileCosts(kit,parts)+'<div data-buildable aria-live="polite"></div></div><div class="actions tile-actions">'+
            button('Edit package','editPackage',kit.id)+button('Add to Cart','add',kit.id,'')+
            button('View Assembly Details','assemblyDetails',kit.id)+button('Delete','deletePackage',kit.id)+'</div></article>'
        ).join('')+'</div>':'<p class="surface empty">Add inventory parts, then create your first package.</p>');
      updateCartAvailability();
      for (const image of document.querySelectorAll('[data-photo]')) asset('package',image.dataset.photo).then(url=>{
        if (url && image.isConnected) { image.src=url; image.hidden=false; }
      }).catch(()=>{});
    }

    function packageTileCosts(kit,parts) {
      const {material}=estimateMaterials(kit.components,parts);
      const profit = material === null ? null : kit.price-material;
      const values = [['Selling Price',kit.price],['Estimated Materials Cost',material],['Estimated Profit',profit]];
      return '<dl class="tile-costs">'+values.map(([label,value])=>'<div><dt>'+label+'</dt><dd'+
        (value!==null && value<0?' class="negative"':'')+'>'+(value===null?'—':money(value))+'</dd></div>').join('')+'</dl>'+
        (material===null?'<p class="muted small">Cost unavailable for one or more components.</p>':'');
    }

    function packageAvailability(kit, reserved) {
      const remaining = kit.components.map(part=>({
        ...part, remaining: Math.max(0, part.stock - (reserved.get(part.id)?.quantity || 0)),
      }));
      const buildable = remaining.length
        ? Math.min(...remaining.map(part=>Math.floor(part.remaining / part.quantity))) : 0;
      return { buildable, remaining, missing: remaining.filter(part=>part.remaining < part.quantity) };
    }

    function updateCartAvailability(summary) {
      if (state.tab!=='packages') return;
      const reserved = (summary || cartSummary()).reserved;
      const packages = new Map(state.data.packages.map(kit=>[kit.id,kit]));
      for (const tile of main.querySelectorAll('[data-kit]')) {
        const kit = packages.get(tile.dataset.kit);
        const {buildable,missing} = packageAvailability(kit,reserved);
        const off = buildable===0;
        const badge = tile.querySelector('[data-stock-status]');
        tile.classList.toggle('off',off);
        badge.classList.toggle('off',off);
        badge.textContent = off ? 'Unavailable' : 'Available';
        const status = tile.querySelector('[data-buildable]');
        const message = '<p class="muted small">'+buildable+' buildable after cart</p>'+
          (missing.length?'<ul class="shortages">'+missing.map(part=>
            '<li>'+safe(part.name)+' · '+part.remaining+' remaining, '+part.quantity+' needed</li>').join('')+'</ul>':'');
        if (status.innerHTML!==message) status.innerHTML=message;

          '<tr><td>'+safe(part.sku)+'</td><td>'+safe(part.name)+(part.consumable?' <span class="badge off">Consumable</span>':'')+'</td><td>'+part.stock+'</td><td>'+safe(part.supplier || '—')+

    function renderOrders() {

      if (!state.orders) {
        panel.innerHTML = head+'<p role="status">Loading orders…</p>';
        const token = state.token;
        rpc('orders').then(orders=>{
          if (state.token !== token) return;
          state.orders = orders;
          if (state.tab === 'orders') renderOrders();
        }).catch(error=>{
          if (state.token !== token || state.tab !== 'orders') return;
          panel.innerHTML = head+'<p class="alert" role="alert">'+safe(error.message)+'</p>';
          if (error.code === 'AUTH') fail(error);
        });
        return;

      const badgeClass = {'Order Placed':'off',Assembling:'status-assembling',Delivery:'status-delivery'};
      panel.innerHTML = head+(state.orders.length ? '<div class="surface scroll"><table><thead><tr>'+

    async function renderFinance() {
      const panel = $('#panel');
      const token = state.token;
      const head = '<div class="row section-head"><h2>Financial Report</h2></div>';
      panel.innerHTML = head+'<p role="status">Loading financial report…</p>';
      try {
        const report = await rpc('financialReport');
        if (!panel.isConnected || state.token!==token) return;
        const metrics = [['Inventory assets',report.inventoryValue],['Order income',report.orderIncome],
          ['Total expenses',report.restockExpenses+report.supplyExpenses],['Part restocks',report.restockExpenses],
          ['Consumables and overhead',report.supplyExpenses]];
        const recent = report.recentSupplies;
        panel.innerHTML = head+'<div class="stack"><p class="muted small">Assets use the recorded cost of current stock. Order income totals active orders regardless of payment status. Expenses are all-time.</p>'+

          (report.uncostedParts?'<p class="alert">'+report.uncostedParts+' stocked '+(report.uncostedParts===1?'part has':'parts have')+
            ' no recorded cost and could not be valued.</p>':'')+
          '<h3>Recent supply expenses</h3>'+
          (recent.length?'<div class="surface scroll"><table><thead><tr>'+
            ['Date recorded','Supply','Supplier','Amount','Notes'].map(label=>'<th scope="col">'+label+'</th>').join('')+
            '</tr></thead><tbody>'+recent.map(item=>'<tr><td>'+displayDate.format(new Date(item.recorded))+
            '</td><td>'+safe(item.name)+'</td><td>'+safe(item.supplier||'—')+'</td><td>'+money(item.amount)+

            :'<p class="surface empty">No supply expenses have been logged yet.</p>')+'</div>';
      } catch(error) {
        if (!panel.isConnected || state.token!==token) return;

      show(order?'Edit order '+orderRef(order.id):'Add order','<form class="stack" data-form="'+(order?'updateOrder':'submitOrder')+

    function readOrderLines(form) {
      const byId = new Map(state.data.packages.map(kit=>[kit.id,kit]));
      return [...form.querySelectorAll('[data-order-line]')].map(row=>{
        const id = row.querySelector('select').value;
        return {id,revision:byId.get(id)?.revision??null,quantity:row.querySelector('input').valueAsNumber};
      });
    }

    function orderEstimate(form) {
      const order = state.orders?.find(item=>item.id===form.dataset.id);
      const prices = new Map(state.data.packages.map(kit=>[kit.id,kit.price]));
      for (const line of order?.lines||[]) prices.set(line.id,line.price);
      const lines = readOrderLines(form);
      const ready = lines.every(line=>prices.has(line.id) && Number.isInteger(line.quantity) && line.quantity>=1 && line.quantity<=99);
      form.querySelector('[data-order-total]').textContent = ready
        ? money(lines.reduce((sum,line)=>sum+prices.get(line.id)*line.quantity,0)) : '—';
    }

        '<div class="actions">'+button('Back','restockPart',id)+'<button class="btn">Save opening cost</button></div></form>');

    function updatePurchaseFields(form) {
      const {stock,purchasePrice,purchaseQuantity,purchaseType} = form.elements;
      const logging = Boolean(purchaseType.value);
      const bulk = purchaseType.value === 'Bulk';
      form.querySelector('[data-purchase]').hidden = !logging;
      form.querySelector('[data-purchase-price-label]').textContent = bulk ? 'Total Price (₱)' : 'Unit Price (₱)';
      form.querySelector('[data-purchase-quantity-label]').textContent = bulk ? 'Total Quantity' : 'Quantity Purchased';
      for (const field of [purchasePrice,purchaseQuantity]) {
        field.disabled = !logging;
        field.required = logging;
      }
      purchasePrice.max = bulk ? '10000000000000' : '10000000';
      if (!logging) return;
      const quantity = purchaseQuantity.valueAsNumber;
      const price = purchasePrice.valueAsNumber;
      const ready = quantity > 0 && Number.isFinite(price) && purchasePrice.validity.valid && purchaseQuantity.validity.valid;
      form.querySelector('[data-purchase-preview]').textContent = ready
        ? (bulk ? 'Unit cost '+unitMoney(Math.round(price*100)/quantity) : 'Purchase total '+money(Math.round(price*100)*quantity))+
          ' · Stock after purchase '+((stock.valueAsNumber||0)+quantity)
        : 'The purchased quantity will be added to the on-hand stock above.';
    }

        (kit?(kit.price/100).toFixed(2):'')+'" required></label><label>Package photo'+imageInput('photo')+'</label></div>'+
        (kit?.hasPhoto?'<label class="check"><input type="checkbox" name="removePhoto">Remove current photo</label>':'')+

        '<div class="stack margin-summary" aria-live="polite"><div class="row"><strong>Total Material Cost</strong><output data-material-cost>—</output></div>'+
        '<div class="row"><strong>Profit</strong><output data-profit>—</output></div><p data-cost-message class="muted small" hidden></p></div>'+
        '<button class="btn">Save package</button>'+consumableCostNote+'</form>');
      const form = dialog.querySelector('form');
      refreshComponentSelectors(form);
      packageMargin(form);
    }

    function confirmDeletePackage(id) {
      const kit = state.data.packages.find(item=>item.id===id);
      if (!kit) return;
      show('Delete package','<form class="stack" data-form="deletePackage" data-id="'+safe(id)+
        '" data-revision="'+kit.revision+'"><p>Remove <strong>'+safe(kit.name)+'</strong> from the package list?</p>'+
        '<p class="muted small">The package will be removed from your cart. Existing orders retain their package details.</p>'+
        '<div class="actions">'+button('Cancel','close')+'<button class="btn danger">Delete package</button></div></form>');
    }

    function estimateMaterials(components,parts) {
      const unpriced = new Set();
      let amount = 0;
      let complete = components.length>0;
      for (const {id,quantity} of components) {
        const part = parts.get(id);
        if (part?.consumable) continue;
        if (!part || !Number.isInteger(quantity) || quantity<1) { complete=false; continue; }
        if (part.averageCost == null) unpriced.add(part.name);
        else amount += part.averageCost * quantity;
      }
      return {material:complete && !unpriced.size ? Math.round(amount) : null,unpriced};
    }

    function packageMargin(form) {
      const parts = new Map(state.data.parts.map(part=>[part.id,part]));
      const components = [...form.querySelectorAll('.recipe')].map(row=>{
        const quantity = row.querySelector('input');
        return {id:row.querySelector('select').value,quantity:quantity.validity.valid ? quantity.valueAsNumber : null};
      });
      const {material,unpriced}=estimateMaterials(components,parts);
      const price = form.elements.price;
      const profit = material !== null && Number.isFinite(price.valueAsNumber) && price.validity.valid
        ? Math.round(price.valueAsNumber*100) - material : null;
      form.querySelector('[data-material-cost]').textContent = material === null ? '—' : money(material);
      const profitOutput = form.querySelector('[data-profit]');
      profitOutput.textContent = profit === null ? '—' : money(profit);
      profitOutput.classList.toggle('negative',profit !== null && profit < 0);
      const message = form.querySelector('[data-cost-message]');
      message.hidden = !unpriced.size;
      message.textContent = unpriced.size ? 'No active unit cost for '+[...unpriced].join(', ')+'.' : '';
    }

    function cartSummary() {
      const packages=new Map(state.data.packages.map(kit=>[kit.id,kit]));
      const parts=new Map();
      let total=0;
      const lines=[...state.cart].map(([id,line])=>{
        const kit=packages.get(id);
        if (kit) {
          total+=kit.price*line.quantity;
          for (const part of kit.components) {
            const previous=parts.get(part.id);
            parts.set(part.id,{name:part.name,stock:part.stock,quantity:(previous?.quantity||0)+part.quantity*line.quantity});
          }
        }
        return {id,kit,quantity:line.quantity};
      });
      return {lines,total,reserved:parts,shortages:[...parts.values()].filter(part=>part.stock<part.quantity)};
    }

    function orderWarning(summary) {
      if (summary.lines.some(line=>!line.kit)) return 'Remove unavailable packages before submitting.';
      return summary.shortages.length ? summary.shortages.map(part=>part.name+' needs '+part.quantity+' units. '+part.stock+' on hand.').join(' ') : '';
    }

    function showCart() {
      const summary=cartSummary();
      const warning=orderWarning(summary);
      if (!summary.lines.length) return show('Cart','<p>Your cart is empty.</p>');
      show('Cart','<div class="stack">'+summary.lines.map(line=>
        '<div class="cart-line"><div><strong>'+safe(line.kit?.name||'Unavailable package')+'</strong><p class="muted small">'+
        (line.kit?money(line.kit.price)+' per package':'Remove this package')+'</p></div><label>Qty<input aria-label="Quantity for '+
        safe(line.kit?.name||'unavailable package')+'" data-quantity="'+line.id+'" type="number" min="1" max="99" value="'+line.quantity+'" required></label>'+
        '<button type="button" class="btn secondary icon" data-action="remove" data-id="'+line.id+'" aria-label="Remove package">×</button></div>').join('')+
        '<div class="row"><strong>Order total</strong><strong id="cart-total">'+money(summary.total)+'</strong></div>'+
        '<p id="cart-warning" class="alert" '+(warning?'':'hidden')+'>'+safe(warning)+'</p>'+
        button('Submit Order','order','','',Boolean(warning))+'</div>');
    }

    function showOrder() {
      const summary=cartSummary();
      if (!summary.lines.length || orderWarning(summary)) return showCart();
      show('Customer details','<form data-form="submitOrder" data-source="cart" class="stack"><div class="row"><strong>Order total</strong><strong>'+
        money(summary.total)+'</strong></div>'+orderDetailsFields()+
        '<button class="btn">Log order and deduct stock</button></form>');
    }

    async function image(file) {
      if (!file?.size) return null;
      if (!['image/jpeg','image/png','image/webp'].includes(file.type)||file.size>1048576) {
        throw new Error('Choose a JPEG, PNG, or WebP image up to 1 MB.');
      }
      const data=await new Promise((resolve,reject)=>{
        const reader=new FileReader();
        reader.onload=()=>resolve(reader.result);
        reader.onerror=()=>reject(new Error('Could not read the selected image.'));
        reader.readAsDataURL(file);
      });
      return {type:file.type,base64:data.slice(data.indexOf(',')+1)};
    }

    document.addEventListener('input',event=>{
      const field=event.target;
      if (field.form?.elements.purchaseType && ['purchasePrice','purchaseQuantity'].includes(field.name)) {
        updatePurchaseFields(field.form);
      }
      if (field.form?.dataset.form==='savePackage' && ['price','quantity'].includes(field.name)) packageMargin(field.form);
      if (field.closest('[data-order-line]')) orderEstimate(field.form);
      const id=field.dataset.quantity;
      if (!id) return;
      if (field.checkValidity() && state.cart.get(id).quantity!==field.valueAsNumber) {
        state.cart.get(id).quantity=field.valueAsNumber;
        state.orderKey=null;
        renderHeader();
      }
      const summary=cartSummary();
      updateCartAvailability(summary);
      const invalid=[...dialog.querySelectorAll('[data-quantity]')].some(input=>!input.checkValidity());
      const warning=invalid?'Enter quantities from 1 to 99.':orderWarning(summary);
      $('#cart-total').textContent=money(summary.total);
      $('#cart-warning').textContent=warning;
      $('#cart-warning').hidden=!warning;
      dialog.querySelector('[data-action=order]').disabled=Boolean(warning);
    });
    document.addEventListener('change',event=>{
      if (event.target.name==='part' && event.target.form?.dataset.form==='savePackage') {
        refreshComponentSelectors(event.target.form);
        packageMargin(event.target.form);
      }
      if (event.target.name === 'purchaseType' && event.target.form?.elements.purchaseType) {
        const form = event.target.form;
        form.elements.purchasePrice.value = '';
        form.elements.purchaseQuantity.value = '';
        updatePurchaseFields(form);
      }
    });

    document.addEventListener('click',async event=>{
      const control=event.target.closest('[data-action]');
      if (!control) return;
      const {action,id}=control.dataset;
      try {
        switch(action) {
          case 'close': dialog.close(); break;
          case 'systemSignIn':
            event.preventDefault();
            state.system=await rpc('systemSignIn',null,null);
            renderSystem();
            main.focus();
            break;
          case 'systemExit': signInView(); break;
          case 'systemRevealKey': {
            const key=await rpc('systemRevealKey',{id},null);
            if (state.system) showSystemKey(id,key);
            break;
          }
          case 'systemReplaceKey': confirmSystemKey(id); break;
          case 'copySystemKey': {
            const key=dialog.querySelector('[data-system-key]');
            if (!key) break;
            try { await navigator.clipboard.writeText(key.value); notice('Access key copied.'); }
            catch { key.focus(); key.select(); dialogError('Use your keyboard to copy the selected access key.'); }
            break;
          }
          case 'tab':
            state.tab=id;
            if (id==='orders') state.orders=null;
            render(); $('[data-action=tab][data-id="'+id+'"]').focus(); break;
          case 'editPart': editPart(id); break;
          case 'deletePart': confirmDeletePart(id); break;
          case 'editPartInfo': editPartInfo(id); break;
          case 'restockPart': restockPart(id); break;
          case 'openingCost': setOpeningCost(id); break;
          case 'purchaseHistory': await showPurchaseHistory(id); break;
          case 'editPackage': editPackage(id); break;
          case 'addConsumable': addPart(true); break;
          case 'assemblyDetails': await showAssemblyDetails(id); break;
          case 'deletePackage': confirmDeletePackage(id); break;
          case 'editOrder': editOrder(id); break;
          case 'deleteOrder': confirmDeleteOrder(id); break;
          case 'addOrderLine':
            if ($('#order-lines').children.length<40) {
              $('#order-lines').insertAdjacentHTML('beforeend',orderLine());
              $('#order-lines').lastElementChild.querySelector('select').focus();
              orderEstimate(control.closest('form'));
            }
            break;
          case 'removeOrderLine':
            if ($('#order-lines').children.length>1) {
              const form = control.closest('form');
              control.closest('[data-order-line]').remove();
              orderEstimate(form);
            }
            break;
          case 'addComponent':
            if (!control.disabled) {
              const form = control.closest('form');
              $('#recipe').insertAdjacentHTML('beforeend',componentRow());
              refreshComponentSelectors(form);
              $('#recipe').lastElementChild.querySelector('select').focus();
              packageMargin(form);
            }
            break;
          case 'removeComponent':
            if ($('#recipe').children.length>1) {
              const form = control.closest('form');
              control.closest('.recipe').remove();
              refreshComponentSelectors(form);
              packageMargin(form);
            }
            break;
          case 'add': {
            const kit=state.data.packages.find(item=>item.id===id);
            const quantity=(state.cart.get(id)?.quantity||0)+1;
            if (!kit || quantity>99 || !packageAvailability(kit,cartSummary().reserved).buildable) {
              return notice('Another package cannot be added with the current cart quantities.');
            }
            state.cart.set(id,{quantity}); state.orderKey=null; renderHeader(); updateCartAvailability(); notice('Added to cart.'); break;
          }
          case 'cart': showCart(); break;
          case 'remove': state.cart.delete(id); state.orderKey=null; renderHeader(); updateCartAvailability(); showCart(); break;
          case 'order': showOrder(); break;
          case 'signOut': await rpc('signOut'); signInView(); break;
        }
      } catch(error) { fail(error); }
    });

    document.addEventListener('submit',async event=>{
      const form=event.target;
      const name=form.dataset.form;
      if (!name) return;
      event.preventDefault();
      const submit=event.submitter||form.querySelector('button:not([type])');
      if (submit.disabled) return;
      submit.disabled=true;
      const data=Object.fromEntries(new FormData(form));
      try {
        if (name==='signIn') {
          const result=await rpc(name,data);
          session(result.token); state.tab='packages'; accept(result);
          return;
        }
        if (name==='systemProvision') {
          const user=await rpc(name,data,null);
          if (!state.system) return;
          state.system.users.push(user);
          state.system.users.sort((a,b)=>a.storeName.localeCompare(b.storeName));
          renderSystem();
          notice('Workspace created. Choose Show key to retrieve its access key.');
          return;
        }
        if (name==='systemReplaceKey') {
          const id=form.dataset.id;
          const key=await rpc(name,{id},null);
          if (!state.system) return;
          state.system.users.find(user=>user.id===id).keyStatus='ready';
          renderSystem();
          if (dialog.open) showSystemKey(id,key);
          else notice('Access key updated.');
          return;
        }
        if (name==='submitOrder') {
          const fromCart = form.dataset.source==='cart';
          if (fromCart) {
            const summary=cartSummary();
            if (!summary.lines.length||orderWarning(summary)) throw new Error('Review quantities in your cart first.');
            state.orderKey ||= crypto.randomUUID();
            data.key=state.orderKey;
            data.lines=summary.lines.map(({kit,id,quantity})=>({id,quantity,revision:kit.revision}));
          } else {
            form.dataset.orderKey ||= crypto.randomUUID();
            data.key=form.dataset.orderKey;
            data.lines=readOrderLines(form);
          }
          const result=await rpc(name,data);
          if (fromCart) { state.cart.clear(); state.orderKey=null; }
          state.orders=null;
          accept(result.dashboard);
          show('Order logged','<div class="stack"><p>Order <strong>'+safe(orderRef(result.id))+
            '</strong> was saved and component stock was deducted.</p><strong>'+money(result.total)+'</strong>'+button('Done','close')+'</div>');
          return;
        }
        if (form.dataset.id) { data.id=form.dataset.id; data.revision=Number(form.dataset.revision); }
        if (name==='updateOrder') data.lines=readOrderLines(form);
        if (name==='savePart' || name==='editPartInfo') {
          data.stock=Number(data.stock);
          data.threshold=Number(data.threshold);
        }
        if (name==='savePart') data.consumable=data.consumable==='yes';
        if (name==='savePart' || name==='setPartOpeningCost') {
          data.openingCost=data.openingCost!=='' ? Math.round(Number(data.openingCost)*100) : null;
        }
        if (name==='restockPart') {
          form.dataset.purchaseKey ||= crypto.randomUUID();
          data.purchase={key:form.dataset.purchaseKey,type:data.purchaseType,quantity:Number(data.purchaseQuantity),
            price:Math.round(Number(data.purchasePrice)*100)};
          delete data.purchaseType; delete data.purchaseQuantity; delete data.purchasePrice;
        }
        if (name==='savePackage') {
          data.price=Math.round(Number(data.price)*100);
          data.components=[...form.querySelectorAll('.recipe')].map(row=>({id:row.querySelector('select').value,quantity:row.querySelector('input').valueAsNumber}));
          data.removeConsumables=[...form.querySelectorAll('[data-keep-consumable]:not(:checked)')].map(field=>field.value);
          delete data.part; delete data.quantity;
          data.photo=await image(data.photo);
          data.removePhoto=Boolean(data.removePhoto)&&!data.photo;
        }
        if (name==='saveBrand') { [data.logo,data.backdrop]=await Promise.all([image(data.logo),image(data.backdrop)]); }
        const result=await rpc(name,data);
        if (name==='deletePackage') {
          state.cart.delete(data.id);
          state.orderKey=null;
          state.assets.delete('package:'+data.id);
        }
        if (name==='updateOrder' || name==='deleteOrder') state.orders=null;
        if (name==='savePackage' || name==='saveBrand') state.assets.clear();
        if (name==='setPartOpeningCost') {
          accept(result);
          restockPart(data.id);
          return;
        }
        if (dialog.open) dialog.close();
        accept(result);
        const notices = {saveBrand:'Branding saved.',savePart:data.consumable?'Consumable saved.':'Part saved.',editPartInfo:'Part info saved.',deletePart:'Part deleted.',
          restockPart:'Restock saved.',savePackage:'Package saved.',deletePackage:'Package deleted.',
          updateOrder:'Order updated.',deleteOrder:'Order deleted and stock returned.'};
        notice(notices[name]);
      } catch(error) {
        if (error.code==='STALE' && ['deletePart','submitOrder','updateOrder','deleteOrder'].includes(name)) {
          try {
            state.orders=null;
            accept(await rpc('dashboard'));
            if (form.dataset.source==='cart') showCart();
          } catch {}
        }
        fail(error);
      } finally { submit.disabled=false; }
    });

    (async()=>{
      try {
        let saved;
        try { saved=sessionStorage.getItem('inventory-session'); } catch {}
        let result;
        try { result=await rpc('start',null,saved||null); }
        catch(error) { if (error.code!=='AUTH') throw error; result=await rpc('start',null,null); }
        if (result) { session(result.token); accept(result); }
        else signInView();
      } catch(error) { signInView(error.message); }
    })();
    setInterval(refreshOrderSummary,60000);
    document.addEventListener('visibilitychange',refreshOrderSummary);
  </script>
</body>
</html>
