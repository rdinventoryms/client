<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Sign in to your brand's inventory workspace.">
  <meta name="theme-color" content="#faf6ed">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="apple-touch-icon" href="./app-icon-192.png">
  <link rel="icon" type="image/png" href="./app-icon-192.png">
  <title>Inventory Management System</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: #faf6ed;
      color: #2d241e;
      font: 1rem/1.45 system-ui, sans-serif;
    }
    .shell {
      display: grid;
      grid-template-rows: auto minmax(0, 1fr);
      height: 100vh;
      height: 100dvh;
    }
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: .35rem 1rem;
      padding: .35rem 1rem;
      background: #fffdf9;
      border-bottom: 1px solid #ddd4c9;
    }
    h1 { margin: 0; font: 600 1rem/1.3 Georgia, serif; }
    button {
      min-height: 44px;
      padding: .4rem .8rem;
      border: 1px solid #ad947b;
      border-radius: .55rem;
      background: #fffdf9;
      color: #573823;
      font: 600 .875rem/1.2 system-ui, sans-serif;
      cursor: pointer;
    }
    button:hover { background: #f4ebde; }
    button:focus-visible { outline: 2px solid #785032; outline-offset: 2px; }
    dialog {
      width: min(24rem, calc(100% - 2rem));
      padding: 1.25rem;
      border: 1px solid #ddd4c9;
      border-radius: .85rem;
      background: #fffdf9;
      color: #2d241e;
    }
    dialog::backdrop { background: #2d241e80; }
    dialog h2 { margin: 0; font: 600 1.3rem Georgia, serif; }
    main { min-width: 0; min-height: 0; }
    iframe { display: block; width: 100%; height: 100%; border: 0; }
    iframe[hidden] { display: none; }
    noscript p { padding: 0 1rem; }
  </style>
</head>
<body>
  <div class="shell">
    <header>
      <h1>Inventory Management System</h1>
      <button id="install-app" type="button" hidden>Install app</button>
    </header>
    <main>
      <iframe id="inventory-app" title="Inventory workspace" hidden></iframe>
      <noscript><p>Enable JavaScript to load the inventory workspace.</p></noscript>
    </main>
  </div>
  <dialog id="install-help" aria-labelledby="install-title">
    <h2 id="install-title">Install Remourà Inventory</h2>
    <p id="install-instructions"></p>
    <form method="dialog"><button>Done</button></form>
  </dialog>
  <script>
    // Replace this value if the Apps Script deployment gets a new /exec URL.
    const APP_EXEC_URL = 'https://script.google.com/macros/s/AKfycbwcl0pEIS8dTJcBdYOFNEWZItvPLgmH85-J3-xuC5X_Ar6HZN4GT3OMzk3gvFVcL-pAZQ/exec';
    const endpoint = new URL(APP_EXEC_URL);
    endpoint.searchParams.set('embed', '1');
    const app = document.getElementById('inventory-app');
    app.src = endpoint.href;
    app.hidden = false;

    const installButton = document.getElementById('install-app');
    const installHelp = document.getElementById('install-help');
    const standalone = matchMedia('(display-mode: standalone)');
    const appleMobile = /iPhone|iPad|iPod/.test(navigator.userAgent) ||
      (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
    let installPrompt = null;
    const updateInstallButton = () => {
      installButton.hidden = standalone.matches || navigator.standalone === true;
    };
    updateInstallButton();
    standalone.addEventListener('change', updateInstallButton);
    window.addEventListener('beforeinstallprompt', event => {
      event.preventDefault();
      installPrompt = event;
    });
    window.addEventListener('appinstalled', () => {
      installPrompt = null;
      installButton.hidden = true;
    });
    installButton.addEventListener('click', async () => {
      if (installPrompt) {
        const prompt = installPrompt;
        installPrompt = null;
        try {
          const { outcome } = await prompt.prompt();
          if (outcome === 'accepted') installButton.hidden = true;
          return;
        } catch {
          // The browser menu remains available if the native prompt expires.
        }
      }
      document.getElementById('install-instructions').textContent = appleMobile
        ? 'In Safari, tap Share, then Add to Home Screen. If shown, turn on Open as Web App, then tap Add.'
        : 'Open your browser menu and look for Install app or Add to Home screen. In Safari on Mac, choose File → Add to Dock.';
      installHelp.showModal();
    });
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('./sw.js').catch(error => console.warn('Unable to register the app service worker.', error));
    }
  </script>
</body>
</html>
