<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Sign in to your brand's inventory workspace.">
  <meta name="theme-color" content="#faf6ed">
  <title>Inventory Management System</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: #faf6ed;
      color: #2d241e;
      font: 1rem/1.45 system-ui, sans-serif;
    }
    .shell {
      display: grid;
      grid-template-rows: auto minmax(0, 1fr);
      height: 100vh;
      height: 100dvh;
    }
    header {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: .125rem 1rem;
      padding: .125rem 1rem;
      background: #fffdf9;
      border-bottom: 1px solid #ddd4c9;
    }
    h1 { margin: 0; font: 600 1rem/1.3 Georgia, serif; }
    a {
      display: inline-flex;
      align-items: center;
      min-height: 44px;
      color: #69442c;
      font-size: .875rem;
      text-underline-offset: .2em;
    }
    a:focus-visible { outline: 2px solid #69442c; outline-offset: 2px; }
    main { min-width: 0; min-height: 0; }
    iframe { display: block; width: 100%; height: 100%; border: 0; }
    iframe[hidden] { display: none; }
    noscript p { padding: 0 1rem; }
  </style>
</head>
<body>
  <div class="shell">
    <header>
      <h1>Inventory Management System</h1>
      <!-- When the Apps Script deployment URL changes, edit this href only. -->
      <a id="app-link" href="https://script.google.com/macros/s/AKfycbwcl0pEIS8dTJcBdYOFNEWZItvPLgmH85-J3-xuC5X_Ar6HZN4GT3OMzk3gvFVcL-pAZQ/exec" target="_blank" rel="noopener">Open app directly</a>
    </header>
    <main>
      <iframe id="inventory-app" title="Inventory workspace" hidden></iframe>
      <noscript><p>Use “Open app directly” to continue to your inventory workspace.</p></noscript>
    </main>
  </div>
  <script>
    const endpoint = new URL(document.getElementById('app-link').href);
    endpoint.searchParams.set('embed', '1');
    const app = document.getElementById('inventory-app');
    app.src = endpoint.href;
    app.hidden = false;
  </script>
</body>
</html>
